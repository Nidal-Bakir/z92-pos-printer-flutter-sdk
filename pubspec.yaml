name: z92_pos_printer_flutter_sdk
description: Android plugin for ZCS Z92 and Z91 built-in POS printers. Print text, columns, images, Code 128 barcodes, and QR codes.
version: 1.0.0
homepage: https://github.com/Nidal-Bakir/z92-pos-printer-flutter-sdk
repository: https://github.com/Nidal-Bakir/z92-pos-printer-flutter-sdk
issue_tracker: https://github.com/Nidal-Bakir/z92-pos-printer-flutter-sdk/issues

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.z92posprinter
        pluginClass: Z92PosPrinter
